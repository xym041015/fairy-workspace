packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
minimumReleaseAgeExclude:
  - dshmarket@1.18.0
  - '@nanmicoder/dsh-agent-teams@0.1.11'
allowBuilds:
  cloudflared: true
  cpu-features: true
  node-pty: true
  ssh2: true

# 显式关闭 pnpm 24h 发布年龄门控:DSH 生态插件常当天发布,
# 默认 minimumReleaseAge=1440 会拦截刚发布的 @linxin666 等依赖。
minimumReleaseAge: 0

